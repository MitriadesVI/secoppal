    legal_classification_status: verified
    retrieval_family: contratacion_directa
    procedure_variant: null
    legal_regime: general
    record_kind: procurement
    submission_mode: standard
    user_searchable: true
    explicit_intent_required: false
    parent_expansion_policy: family_default
    dataset_values:
      procesos: ["Contratación directa"]
      contratos: ["Contratación directa"]
    evidence_confidence: alta
    notes: Modalidad general (Ley 1150/2007 art. 2 num. 4).

