      contratos: ["Contratación Directa (con ofertas)"]
    evidence_confidence: media
    notes: >-
      D3/H5: mismo hecho jurídico que contratación directa; "(con ofertas)"
      es el módulo de plataforma que recibe ofertas, no una modalidad distinta.

