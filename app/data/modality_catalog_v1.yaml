# MOD-M1 — Catálogo canónico de modalidad V1 (declarativo).
#
# Un registro por VALOR RAW de `modalidad_de_contratacion` observado en el
# snapshot live (tests/fixtures/modality_raw_snapshot_v1.json). Este archivo NO
# contiene resolver, parser ni builder — solo datos (M2+ los consumirán).
#
# Doble taxonomía (D4): `legal_selection_family` (dimensión jurídica) y
# `retrieval_family` (dimensión de recuperación/UX) son campos SEPARADOS.
#
# El estado de clasificación jurídica es un campo PROPIO (`legal_classification_status`),
# NO un sentinel dentro de legal_selection_family: cuando no hay familia jurídica
# de selección, legal_selection_family es null y el estado lo explica.
#
# Decisiones de producto codificadas: D1 (acuerdo marco = categoría propia),
# D2 (enajenación = venta de activos, intención explícita), D3 (padres generales
# incluyen con/sin ofertas).
#
# Vocabularios controlados (validados en app/core/modality_models.py):
#   legal_selection_family: licitacion_publica | seleccion_abreviada |
#     concurso_de_meritos | minima_cuantia | contratacion_directa | null
#   legal_classification_status: verified | pending_review | not_applicable
#   record_kind: procurement | procurement_instrument | state_asset_sale |
#     planning_rfi | platform_test
#   submission_mode: standard | con_ofertas | no_aplica
#   legal_regime: general | especial | no_aplica
#   parent_expansion_policy: family_default | explicit_only | never
#   evidence_confidence: alta | media | baja

version: 1
snapshot_ref: tests/fixtures/modality_raw_snapshot_v1.json

procedures:
