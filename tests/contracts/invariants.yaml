# Registro canónico de invariantes — TEST_ARCHITECTURE_V1 F2.
#
# Espacio de nombres: INV-<DOMAIN>-<SLUG>. Los IDs heredados (INV-7, INV-001,
# INV-W16, INV-NAME-NO-GUESS…) no se reescriben en su origen: se mapean aquí con
# `legacy_ids` {id, scope}, porque el mismo literal significa cosas distintas en
# documentos distintos. Espacios locales no mapeados: docs/testing/INVARIANT_REGISTRY_V1.md.
#
# primary_tests: la defensa que debe fallar si el invariante se rompe.
# supporting_tests: defensas adicionales; ninguna se retira sin TEST_RETIREMENT_PROOF.
# product_cases: escenarios de tests/fixtures/product_contract_v1/scenarios.yaml.
# re_home_before_f6: el primario vive en una suite con nombre histórico; F6 no puede
#   moverla a audit sin antes darle un hogar vigente a esa defensa.
version: "1.0"
invariants:

  # ── P0 ────────────────────────────────────────────────────────────────
  INV-ACTOR-NAME-NO-GUESS:
    title: "Un nombre nunca se convierte en identidad sin autoridad exacta o selección del usuario"
    description: "Recuperación difusa, ambigüedad o top candidate no deciden identidad; el nombre no resuelto no ejecuta."
    criticality: P0
    owner: actor
    authority: [ADR-060, docs/audits/2026-08-26_HCA_R7_ACTOR_HYGIENE.md]
    status: DEFENDED
    primary_tests:
      - tests/test_actor_routing.py::test_inv_name_no_guess_a_named_actor_is_declared_never_resolved
      - tests/test_actor_routing.py::test_inv_name_no_guess_an_unresolved_name_never_executes
      - tests/test_actor_name_resolver.py::test_frequency_heavy_exact_ambiguity_never_selects_an_identity
    supporting_tests:
      - tests/test_actor_resolution_orchestration.py::test_full_fuzzy_candidates_are_pending_and_not_authoritative
      - tests/test_actor_exact_prefix_properties.py::test_fuzzy_only_aliases_do_not_change_exact_authority
      - tests/test_actor_conversation.py::test_r7_ambiguous_pending_reply_never_selects_or_mutates_frame
    product_cases: [PC-AUTH-003, PC-AUTH-004]
    legacy_ids:
      - {id: INV-NAME-NO-GUESS, scope: "ADR-060 / ACTOR_PROFILE_V1"}
      - {id: INV-FUZZY-NEVER-DECIDES-IDENTITY, scope: "HCA_R7_ACTOR_HYGIENE"}
      - {id: INV-NAME-FUZZY-NOT-AUTHORITY, scope: "ACTOR_NAME_RESOLUTION_BENCHMARK"}
      - {id: INV-NAME-AMBIGUOUS, scope: "ACTOR_NAME_RESOLUTION_BENCHMARK"}
    notes: "El único test con índice real (test_actor_conversation_dogfood R7) está siempre en skip (H2)."

  INV-ACTOR-ID-TYPE:
    title: "Mismo número con distinto tipo documental no es el mismo actor"
    description: "La identidad es (tipo, número); normalizar nunca fusiona tipos declarados distintos."
    criticality: P0
