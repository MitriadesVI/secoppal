version: AP3-F-NATURAL-ACTOR-V1
description: >-
  Expanded deterministic corpus. Every strong family is crossed with every
  real production actor below; every sequence family is crossed with the same
  actors. Expected values describe semantic operations/frame mutations, not
  response prose.

real_actors:
  - name: FUNSOCOM
    document_type: NIT
    base_number: "900334689"
  - name: JORGE VERBEL
    resolution: candidates
  - name: JOSE CANTILLO
    resolution: ambiguous
  - name: UNIVERSIDAD INDUSTRIAL DE SANTANDER
    document_type: NIT
    base_number: "890201213"
  - name: LMP INGENIERIA SAS
    document_type: NIT
    base_number: "900739049"
  - name: EMPRESA PARA LA COMPETITIVIDAD TERRITORIAL DEL MUNICIPIO DE GIRARDOTA
    document_type: NIT
    base_number: "901464458"
  - name: EMPRESA DE DESARROLLO URBANO Y RURAL DEL MUNICIPIO DE BELLO
    document_type: NIT
    base_number: "901465133"
  - name: FONDO MIXTO PARA LA PROMOCION DE LA CULTURA Y LAS ARTES DE BOYACA
    document_type: NIT
    base_number: "820000107"
  - name: E.S.E HOSPITAL PEDRO LEON ALVAREZ DIAZ
