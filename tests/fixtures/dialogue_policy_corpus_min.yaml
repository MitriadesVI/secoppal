    severity: HIGH
    source: "CORPUS_BACKLOG.md OPP-INTENT-001"
    should_execute: true
    expected_signals: ["implicit_opportunity"]
    expected_params:
      intent_type: "opportunity_search"

  - id: OPP-IMPL-002
    query: "alguna oferta del sena en huila"
    category: implicit_opportunity
    severity: HIGH
    source: "CORPUS_BACKLOG.md OPP-INTENT-001"
    should_execute: true
