# =====================================================================
- id: P1-SCOPE-001
  category: scope_sentinel
  severity_if_failed: P1
  notes: "INSUFFICIENT_EVIDENCE — liquidado sigue sin filtro de estado (HCA-STATE-003)"
  turns:
  - {q: "contratos liquidados de obra en 2025", expect: execute, ds: contratos, absent: [estado_contrato]}
- id: P1-SCOPE-002
  category: scope_sentinel
  severity_if_failed: P1
  notes: "INSUFFICIENT_EVIDENCE — procesos liquidados conserva su dataset actual (HCA-SOURCE-002)"
  turns:
  - {q: "procesos liquidados de obra en cauca", expect: execute, ds: contratos}
- id: P1-SCOPE-003
  category: scope_sentinel
  severity_if_failed: P1
  notes: "KNOWN_DEFERRED — modalidad fuera de alcance sigue fail-safe"
  turns:
  - {q: "contratos por seleccion abreviada de menor cuantia en 2026", expect: block}
- id: P1-SCOPE-004
  category: scope_sentinel
  severity_if_failed: P1
  notes: "KNOWN_DEFERRED — enajenación sigue fail-safe"
  turns:
  - {q: "procesos de enajenacion de bienes en 2026", expect: block}
- id: P1-SCOPE-005
  category: scope_sentinel
  severity_if_failed: P1
  notes: "KNOWN_DEFERRED — régimen especial sigue fail-safe"
  turns:
  - {q: "procesos de regimen especial en 2026", expect: block}
- id: P1-SCOPE-006
  category: scope_sentinel
  severity_if_failed: P1
  notes: "SAFE_UNSUPPORTED — salud sin acotar sigue pidiendo precisión"
  turns:
  - {q: "contratos de salud en amazonas", expect: block}
