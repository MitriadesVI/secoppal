# ── I. ANTI-METAMÓRFICAS ─────────────────────────────────────────────
# No dependen de valores concretos: detectan colapso de significado.

- id: NEG-ANTI-001
  category: negation_anti_metamorphic
  severity_if_failed: P1
  notes: >-
    "de alimentación SIN transporte" vs "SIN alimentación NI transporte":
    significados opuestos. Hoy producen el MISMO frame
    (objeto=[alimentacion, transporte]).
  differ_from: {case: NEG-N5, fields: [objeto, objeto_exclude]}
  turns:
  - q: "contratos sin alimentacion ni transporte"

- id: NEG-ANTI-002
  category: negation_anti_metamorphic
  severity_if_failed: P0
  notes: >-
    Una consulta y su negación no pueden producir el mismo frame material.
    Hoy NEG-N2 y NEG-N12 difieren solo en objeto, nunca en polaridad.
  differ_from: {case: NEG-N12, fields: [ciudad, entidad_resolved]}
  turns:
  - q: "contratos de alimentacion que no sean de barranquilla"
