# =====================================================================
# HCA-R4 — Corpus focal de negación transversal (PRE-REGISTRADO)
# =====================================================================
#
# ESTADO: artefacto de DISEÑO. Este archivo NO se ejecuta.
#   - ningún test lo carga por glob (verificado: no hay glob sobre
#     tests/fixtures/audits/ en tests/ ni en scripts/);
#   - el runner HCA solo lee el corpus que recibe por --corpus.
#
# Se pre-registra ANTES de escribir runtime para que la frontera de
# aceptación no se ajuste a lo que resulte fácil de implementar.
#
# Diseño: docs/architecture/DIMENSIONAL_NEGATION_SEMANTICS.md
# Decisión: ADR-064 (docs/decisions_log.md)
#
# NO sustituye a tests/fixtures/audits/conversation_holistic_v1.yaml
# (congelado, sha256 262c225c7939f04516ee95b3c77b4911f9f476058941a88a61d01c918499ffba),
# que sigue siendo la autoridad de no-regresión conversacional.
#
# DSL: el del runner HCA-1 (expect/eq/has/absent/objeto_has/objeto_not/
# soql_has/soql_not/resp_has, same_frame_as, differ_from), más tres claves
# de diseño que el bloque de implementación deberá honrar:
#
#   expected_dimension     — qué dimensión queda negada
#   expected_policy        — EXECUTE | CLARIFY
#   must_not_silently_drop — el marcador no puede desaparecer sin traza
#
# "expect: block" == no ejecuta y aclara (clarification_question presente).
# =====================================================================

version: 1
frozen_against: "9ecf3be0e1b5acdda31fc8fe6ead6073df3f137f"
runtime_changed: false

cases:

# ── A. OBJECT — SUPPORTED V1 ─────────────────────────────────────────

- id: NEG-N1
  category: negation_object
  severity_if_failed: P1
  expected_dimension: OBJECT
  expected_policy: EXECUTE
  must_not_silently_drop: true
  notes: >-
    "sin X" es exclusión temática. Hoy produce objeto=[alimentacion] positivo.
    El marcador "sin" no está en la regex del parser (solo excluye|excluir|excepto).
  turns:
  - q: "contratos sin alimentacion"
    expect: execute
    has: [objeto_exclude]
    objeto_not: [alimentacion]
    soql_has: ["NOT ("]

- id: NEG-N5
  category: negation_object
  severity_if_failed: P1
  expected_dimension: OBJECT
  expected_positive: [alimentacion]
  expected_exclusion: [transporte]
  expected_policy: EXECUTE
  must_not_silently_drop: true
  notes: >-
    Alcance del marcador: "sin" gobierna solo el span que le sigue.
    Hoy: objeto=[alimentacion, transporte] — ambos positivos.
  turns:
  - q: "contratos de alimentacion sin transporte"
    expect: execute
    objeto_has: [alimentacion]
    objeto_not: [transporte]
    has: [objeto_exclude]

- id: NEG-N6
  category: negation_object
  severity_if_failed: P1
  expected_dimension: OBJECT
  expected_positive: []
  expected_exclusion: [alimentacion, transporte]
  expected_policy: EXECUTE
  must_not_silently_drop: true
  notes: >-
    "ni" propaga el marcador anterior. Dos exclusiones, cero positivos.
    Hoy: idéntico a NEG-N5 — dos significados opuestos, un solo frame.
  turns:
  - q: "contratos sin alimentacion ni transporte"
    expect: execute
    objeto_not: [alimentacion, transporte]
    has: [objeto_exclude]

- id: NEG-N16
  category: negation_object
  severity_if_failed: P2
  expected_dimension: OBJECT
  expected_exclusion: [alimentacion]
  expected_policy: EXECUTE
  must_not_silently_drop: true
  notes: >-
    Subjuntivo. Hoy: objeto=[excluyan, alimentacion] — el verbo fuga al objeto
    (familia HCA-TOPIC-VERB-001) y la exclusión se pierde.
  turns:
  - q: "contratos que excluyan alimentacion"
    expect: execute
    objeto_not: [excluyan, alimentacion]
    has: [objeto_exclude]

# ── B. MODALITY — EXISTING, no debe cambiar ──────────────────────────

- id: NEG-N4
  category: negation_modality
  severity_if_failed: P0
  expected_dimension: MODALITY
  expected_exclusion: [minima_cuantia]
  expected_policy: EXECUTE
  must_not_silently_drop: true
  notes: "Autoridad existente. PASA hoy. Cualquier regresión aquí invalida el bloque."
  turns:
  - q: "contratos de vigilancia excepto minima cuantia"
    expect: execute
    has: [modalidad_exclude_procedure_ids]
    absent: [objeto_exclude]
    objeto_has: [vigilancia]
    soql_has: ["NOT IN"]

- id: NEG-N15
  category: negation_modality
  severity_if_failed: P0
  expected_dimension: MODALITY
  expected_policy: EXECUTE
  must_not_silently_drop: false
  notes: >-
    "sin" DENTRO de un alias (modality_lexicon_v1.yaml:137) es inclusión,
    no exclusión. Disciplina de gap. PASA hoy; protegerlo es el riesgo #1
    de ampliar el vocabulario de marcadores.
  turns:
  - q: "contratacion directa sin ofertas"
    expect: execute
    has: [modalidad_include_procedure_ids]
    absent: [modalidad_exclude_procedure_ids, objeto_exclude]

- id: NEG-N14
  category: negation_anti
  severity_if_failed: P1
  expected_dimension: null
  expected_policy: EXECUTE
  must_not_silently_drop: false
  notes: >-
    Anti-negación de dominio: "sin ánimo de lucro" (ESAL) es terminología
    jurídica, no exclusión. Un detector ingenuo de "sin" produciría
    objeto_exclude=[animo, lucro]: mal dimensión y mal valor.
  turns:
  - q: "contratos con entidades sin animo de lucro"
    expect: execute
    absent: [objeto_exclude]

# ── C. GEOGRAPHY — CLARIFY V1 ────────────────────────────────────────

- id: NEG-N2
  category: negation_geography
  severity_if_failed: P0
  expected_dimension: CITY
  expected_positive: {objeto: [aseo]}
  expected_exclusion: {ciudad: Barranquilla}
  expected_policy: CLARIFY
  must_not_silently_drop: true
  notes: >-
    Hoy ejecuta lo CONTRARIO: ciudad=Barranquilla positivo Y
    entidad_resolved=DISTRITO ... DE BARRANQUILLA vía _CITY_TO_ENTITY.
    La inversión es doble. Mínimo innegociable: el valor negado nunca
    positivo, en ninguna dimensión.
  turns:
  - q: "contratos de aseo que no sean de barranquilla"
    expect: block
    absent: [ciudad, entidad_resolved]
    objeto_not: [barranquilla]

- id: NEG-N17
  category: negation_geography
  severity_if_failed: P0
  expected_dimension: CITY
  expected_policy: CLARIFY
  must_not_silently_drop: true
  notes: >-
    El span de ciudad se consume en el paso 10.5, antes de que la regex de
    exclusión corra en el paso 11: la cola de "excepto" queda vacía y el
    resultado es ciudad positiva. Prueba de que la arbitración actual por
    orden de archivo es accidental.
  turns:
  - q: "contratos de aseo excepto en barranquilla"
    expect: block
    absent: [ciudad, entidad_resolved]

- id: NEG-N3
  category: negation_geography
  severity_if_failed: P0
  expected_dimension: CITY dentro de DEPARTMENT
  expected_positive: {departamento_resolved: Atlántico}
  expected_exclusion: {ciudad: Barranquilla}
  expected_policy: CLARIFY
  must_not_silently_drop: true
  notes: >-
    Hoy: departamento=Atlántico + ciudad=Barranquilla + entidad de Barranquilla
    = el complemento EXACTO de lo pedido. La aclaración debe conservar el
    alcance positivo, nunca sustituirlo por el valor negado.
  turns:
  - q: "contratos en atlantico menos barranquilla"
    expect: block
    absent: [ciudad, entidad_resolved]

- id: NEG-N3B
  category: negation_geography
  severity_if_failed: P1
  expected_dimension: DEPARTMENT
  expected_policy: EXECUTE
  must_not_silently_drop: true
  notes: >-
    SET_EXCLUSION sobre vocabulario cerrado con alcance positivo explícito:
    se resta de departamentos_in ANTES del SoQL. Sin predicado negativo,
    sin semántica de NULL, sin tocar SoQLBuilder. La exclusión más barata.
  turns:
  - q: "contratos de aseo en la costa caribe menos atlantico"
    expect: execute
    has: [departamentos_in]
    soql_not: ["NOT IN (", "No Definido"]

# ── D. TIME — CLARIFY_ONLY V1 ────────────────────────────────────────

- id: NEG-N8
  category: negation_time
  severity_if_failed: P1
  expected_dimension: TIME
  expected_exclusion: {year: 2025}
  expected_policy: CLARIFY
  must_not_silently_drop: true
  notes: >-
    Un rango cerrado único no puede expresar un hueco. Hoy produce
    fecha_desde=2025-01-01 + fecha_hasta=2025-12-31: el complemento exacto.
    Mínimo obligatorio: NO producir el rango positivo.
  turns:
  - q: "contratos de aseo en valledupar"
    expect: execute
  - q: "menos los de 2025"
    expect: block
    absent: [fecha_desde, fecha_hasta]

- id: NEG-N13
  category: negation_money_control
  severity_if_failed: P0
  expected_dimension: MONEY
  expected_policy: EXECUTE
  must_not_silently_drop: false
  notes: >-
    CONTROL ANTI-REGRESIÓN. "menos de <cantidad>" es POLARITY_INVERSION,
    no exclusión: el span monetario se consume en el paso 9. Protege ADR-063.
    Ampliar el vocabulario de marcadores con "menos" sin respetar spans
    consumidos rompe este caso.
  turns:
  - q: "contratos de vigilancia por menos de 500 millones"
    expect: execute
    eq: {valor_max: 500000000}
    absent: [valor_min, objeto_exclude]

# ── E. CONTRADICCIONES — CLARIFY, fail-closed ────────────────────────

- id: NEG-N7
  category: negation_contradiction
  severity_if_failed: P1
  expected_dimension: OBJECT
  expected_policy: CLARIFY
  must_not_silently_drop: true
  notes: >-
    Hoy: objeto=[alimentacion, pero] — el duplicado se deduplica, la
    contradicción se evapora y el conector fuga al objeto.
    ModalityFilter ya lanza ValueError ante include∩exclude; objeto no.
  turns:
  - q: "contratos de alimentacion pero sin alimentacion"
    expect: block

- id: NEG-N9
  category: negation_contradiction
  severity_if_failed: P1
  expected_dimension: TIME
  expected_policy: CLARIFY
  must_not_silently_drop: true
  turns:
  - q: "contratos de aseo en 2025 menos los de 2025"
    expect: block
    absent: [fecha_desde, fecha_hasta]

- id: NEG-N7B
  category: negation_contradiction
  severity_if_failed: P1
  expected_dimension: OBJECT
  expected_policy: CLARIFY
  must_not_silently_drop: true
  notes: >-
    Contradicción por herencia. Hoy: objeto=[alimentacion] Y
    objeto_exclude=[alimentacion] coexisten y el SoQL resultante es
    (LIKE '%alimentacion%') AND NOT (LIKE '%alimentacion%'):
    cero filas GARANTIZADAS, presentadas como "no encontré resultados".
    Un cero fabricado es indistinguible de un cero real.
  turns:
  - q: "contratos de alimentacion en barranquilla"
    expect: execute
  - q: "excluye alimentacion"
    expect: block

# ── F. FOLLOW-UP ─────────────────────────────────────────────────────

- id: NEG-N10
  category: negation_followup
  severity_if_failed: P1
  expected_dimension: OBJECT
  expected_policy: CLARIFY
  must_not_silently_drop: true
  notes: >-
    Hoy: intent=contextual_requery y el frame merged es IDÉNTICO al de T1.
    No-op silencioso: el turno del usuario no cambia nada y nadie se lo dice.
    Viola INV-NO-SILENT-NEGATION-DROP.
  turns:
  - q: "contratos de alimentacion en barranquilla"
    expect: execute
  - q: "sin alimentacion"
    expect: block

- id: NEG-N11
  category: negation_followup
  severity_if_failed: P0
  expected_dimension: CITY
  expected_policy: CLARIFY
  must_not_silently_drop: true
  notes: >-
    El peor caso del bloque. Hoy: intent=change_scope usando como evidencia
    el valor que el usuario acaba de RECHAZAR; normalize_scope_transition
    borra Atlántico y deja ciudad=Barranquilla + entidad de Barranquilla.
    Regla estructural: un valor gobernado por marcador negativo nunca puede
    servir de evidencia para clasificar la intención del turno.
  turns:
  - q: "contratos de aseo en atlantico"
    expect: execute
  - q: "menos barranquilla"
    expect: block
    absent: [ciudad]
    has: [departamento_resolved]

- id: NEG-N11B
  category: negation_followup
  severity_if_failed: P1
  expected_dimension: OBJECT
  expected_policy: EXECUTE
  must_not_silently_drop: true
  notes: >-
    Ciclo de vida de la exclusión. requested_clear_fields no tiene hoy slot
    para objeto_exclude: una exclusión heredada NO se puede retirar por
    lenguaje, aunque refinement_recovery ya la etiquete como "exclusión".
  turns:
  - q: "contratos de aseo sin transporte"
    expect: execute
    has: [objeto_exclude]
  - q: "quita la exclusion"
    expect: execute
    absent: [objeto_exclude]
    objeto_has: [aseo]

