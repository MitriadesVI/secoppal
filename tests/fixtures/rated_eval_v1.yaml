# SECOPPAL — Eval set sobre queries REALES calificadas por el usuario.
#
# Fuente: data/feedback.jsonl (42 entradas con rating 👍/👎 al 2026-05-25).
# A diferencia de query_corpus_v1.yaml (queries sintéticas), aquí cada query
# la escribió un usuario real y la calificó. El bloque `expected` codifica el
# comportamiento CORRECTO (autoría nuestra, leyendo el comentario), no el
# comportamiento que se registró.
#
# Esquema por entrada:
#   id               — RATED-NNN, estable.
#   query            — texto literal del usuario.
#   recorded_rating  — 0 (👎) / 1 (👍) que dejó el usuario. Las de 0 son
#                      "regresiones-objetivo": recuperarlas sube la precisión.
#   tier             — parser (offline, CI) | pipeline (red/multi-turno, --live).
#   tags             — categoría del fallo, para precision por tag.
#   comment          — comentario textual del usuario (trazabilidad).
#   expected         — aserciones sobre params parseados. Directivas:
#       <campo>: valor                  → igualdad
#       <campo>_contains: [..]          → membresía en lista (objeto, etc.)
#       objeto_must_not_contain: [..]   → blocklist en objeto
#       absent: [..]                    → estas claves deben estar vacías
#
# Correr:  python scripts/eval_rated.py            (parser-tier)
#          python scripts/eval_rated.py --regressions --verbose
#          python scripts/eval_rated.py --sync      (regenerar esqueletos)

queries:
