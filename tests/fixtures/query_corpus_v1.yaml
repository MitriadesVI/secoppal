# SECOPPAL Query Corpus v1 — regression harness for the deterministic parser
# and the follow-up workflow.
#
# Source mix:
#   - negatives_feedback : 24 unique queries with rating=0 from data/feedback.jsonl
#     (IDs CORPUS-R001..R024, in source order)
#   - followup_manual    : 3 manual follow-up scenarios derived from feedback
#     (IDs CORPUS-R025..R027)
#   - top_freq           : 15 highest-frequency queries from feedback.jsonl
#     (IDs CORPUS-F001..F015)
#   - opportunity_cases  : Pamplonita + manual openness checks
#     (IDs CORPUS-OC001..OC005)
#   - bidder_intent      : commercial bidder / "presentarme" scenarios
#     (IDs CORPUS-BI001..BI005)
#   - value_ranges       : monetary range patterns
#     (IDs CORPUS-V001..V008)
#   - morphological      : plural/singular and PTAR-style topics
#     (IDs CORPUS-M001..M005)
#   - references         : outliers / process IDs / single-municipio
#     (IDs CORPUS-REF001..REF003)
#   - contextual_requery : multi-turn topic switches
#     (IDs CORPUS-CR001..CR005)
#   - analytical         : "cuanto suma", "cuantos hay"
#     (IDs CORPUS-AN001..AN005)
#   - smoke              : positive sanity checks that must keep passing
#     (IDs CORPUS-SM001..CORPUS-SM010)
#
# Severity field:
#   - critical : breaks a top-frequency user flow or a manually-reported sprint
#   - high     : silent wrong-answer; user gets results but they are misleading
#   - medium   : edge case or cosmetic
#   - smoke    : positive baseline, regression alarm only
#
# Assertion semantics (see scripts/run_query_corpus.py):
#   - expected.<key>: scalar  → require parsed[key] == value
#   - expected.<key>_contains : sequence  → require every item in actual[key]
#   - expected.not_present    : sequence  → require key absent or falsy
#   - workflow turns: expected_intent matches the followup classifier,
#     expected_frame applies the same semantics to the merged frame
#
# Owners: parser team. Adding a query: add an entry, run the runner,
# inspect FAIL vs PASS, and only commit if FAIL is intentional (= flagged bug).
version: 1
generated_from: data/feedback.jsonl
notes: |
  This is a living regression file. FAIL entries are NOT corpus bugs — they
  are real parser/workflow bugs we have not yet fixed. Each FAIL row should
  map to an open ticket or a follow-up commit.

