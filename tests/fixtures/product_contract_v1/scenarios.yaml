  - id: PC-MONEY-001
    title: "\"Más de\" fija sólo el mínimo y no inventa máximo"
    status: READY
    severity: critical
    family: money
    mandatory_item: 7
    source: {kind: feedback, reference: "Money Polarity V2 (ADR-093); 18 pedidos vs 2.766 entregados"}
    invariants: [INV-MONEY-POLARITY-PRESERVES-INTENT]
    fixtures: {source_rows: source_rows/harness_canary.jsonl}
    turns:
      - text: "contratos de mantenimiento vial de más de 500 millones"
        expect:
          params: {valor_min: 500000000}
          absent_params: [valor_max]
          source_calls: {min: 1}
          datasets_called: {only: [jbjy-vk9h]}
          results: {must_include_ids: [PC-CANARY-001], must_exclude_ids: [PC-CANARY-002, PC-DECOY-001]}
          lineage: {raw_text: "contratos de mantenimiento vial de más de 500 millones"}
    mutation:
      law: INV-MONEY-POLARITY-PRESERVES-INTENT
      kind: drop_money_floor
      expected_failure: params.valor_min
    mine_from: [tests/test_money_polarity_v2.py::test_upper_cannot_produce_lower]

  - id: PC-MONEY-002
    title: "Rango monetario atómico; contradicción no ejecuta"
    status: READY
    severity: high
    family: money
    mandatory_item: 8
    source: {kind: audit, reference: "ADR-063 / money_range_atomicity"}
    invariants: [INV-MONEY-RANGE-ATOMIC]
    fixtures: {source_rows: source_rows/f3_money_time.jsonl}
    turns:
      - text: "contratos de obra de más de 500 y menos de 100 millones"
        chat_id: contradiction
        expect:
          outcome: clarification
          params: {valor_min: 500000000, valor_max: 100000000}
          source_calls: {exact: 0}
      - text: "contratos de obra entre 100 y 150 millones"
        chat_id: valid_range
        expect:
          outcome: success
          params: {valor_min: 100000000, valor_max: 150000000}
          source_calls: {min: 1}
          datasets_called: {only: [jbjy-vk9h]}
          soql: {contains: ["valor_del_contrato >= 100000000", "valor_del_contrato <= 150000000"]}
          results: {must_include_ids: [PC-RANGE-125], must_exclude_ids: [PC-RANGE-175]}
    mutation:
      law: INV-MONEY-RANGE-ATOMIC
      kind: drop_range_upper
      expected_failure: params.valor_max
    mine_from: [tests/test_money_range_atomicity.py::test_partial_range_blocks_instead_of_degrading]

