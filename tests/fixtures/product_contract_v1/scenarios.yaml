# Product Contract V1 — primer lote de 20 (plan §14.1).
# Sólo READY entra al gate; DESIGN conserva preguntas y valores por acreditar.
# TBD_RUNTIME = valor canónico a tomar del runtime acreditado; nunca inventarlo.
# Valores concretos citados aquí ya son oráculo en un test del gate (ver mine_from).
version: "1.0-design"
scenarios:
  - id: PC-AUTH-001
    title: "Alcaldía de Barranquilla en Entity Profile no se interpreta como actor persona"
    status: DESIGN
    severity: critical
    family: authority_arbitration
    mandatory_item: 1
    red_first: true
    source: {kind: incident, reference: "TEST_ARCHITECTURE_V1 H1; Buyer-Actor V1 47e46a1 (ruta search)"}
    invariants: [INV-BUYER-NOT-ACTOR, INV-ACTOR-NAME-NO-GUESS]
    fixtures: {actor_pack: incident_barranquilla_collisions, source_rows: TBD_RUNTIME}
    turns:
      - text: "analiza la alcaldía de barranquilla"
        expect:
          route: entity_profile
          forbidden_routes: [actor_profile]
          params: {entidad_resolved: "DISTRITO ESPECIAL INDUSTRIAL Y PORTUARIO DE BARRANQUILLA"}
          absent_params: [actor_scope, actor_pending, contratista]
          source_calls: {min: 1}
          response: {not_contains: [TBD_RUNTIME]}
    mine_from:
      - tests/test_buyer_actor_role_arbitration_v1.py::test_seeds
      - tests/test_entity_profile_workflow.py::test_integration_preserves_explicit_intent_precedence
    open_questions:
      - "Forma exacta de las colisiones del incidente: derivar del índice real (pack minimizado, §9.3)."
      - "El canónico citado está acreditado en la ruta search; reverificar en la ruta entity_profile."

  - id: PC-AUTH-002
    title: "Comprador explícito con proveedores homónimos no se vuelve actor"
    status: DESIGN
    severity: critical
    family: authority_arbitration
    mandatory_item: 2
    source: {kind: audit, reference: "Buyer-Actor Role Arbitration V1"}
    invariants: [INV-BUYER-NOT-ACTOR]
    fixtures: {actor_pack: buyer_mention_homonyms_x3, source_rows: barranquilla_contracts_with_decoys}
    turns:
      - text: "que ha contratado alcaldia de barranquilla por mas de 2000 millones"
        expect:
          params:
            dataset: contratos
            entidad_resolved: "DISTRITO ESPECIAL INDUSTRIAL Y PORTUARIO DE BARRANQUILLA"
            valor_min: 2000000000
          absent_params: [actor_scope, actor_pending, contratista]
          datasets_called: {only: [jbjy-vk9h]}
          source_calls: {min: 1}
    mine_from: [tests/test_buyer_actor_role_arbitration_v1.py::test_seeds]

  - id: PC-AUTH-003
