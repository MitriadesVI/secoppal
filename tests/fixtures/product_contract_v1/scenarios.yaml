  - id: PC-OPP-001
    title: "Oportunidad vigente por fecha civil colombiana sin certificar apertura"
    status: READY
    severity: high
    family: opportunity_truth
    mandatory_item: 16
    source: {kind: audit, reference: "ADR-056/058 O1B"}
    invariants: [INV-TIME-OPPORTUNITY-VIGENCIA-NOT-CERTIFICATION]
    today: "2026-09-08"
    reference_instant: "2026-09-08T12:00:00Z"
    fixtures: {source_rows: source_rows/f3_opportunities.jsonl}
    turns:
      - text: "oportunidades de mantenimiento vial"
        expect:
          outcome: success
          params: {intent_type: opportunity_search, dataset: procesos}
          datasets_called: {only: [p6dx-8zbt]}
          source_calls: {min: 1}
          soql: {contains: ["fecha_de_recepcion_de >= '2026-09-08T00:00:00.000'", "fecha_de_publicacion_del >= '2026-06-10T00:00:00.000'"]}
          results:
            must_include_ids: [PC-OPP-TODAY, PC-OPP-FUTURE, PC-OPP-UNKNOWN-RECENT]
            must_exclude_ids: [PC-OPP-PAST, PC-OPP-UNKNOWN-OLD]
          response: {contains: ["Vigencia por verificar"], not_contains: ["Recepción de ofertas"]}
    mutation:
      law: INV-TIME-OPPORTUNITY-VIGENCIA-NOT-CERTIFICATION
      kind: drop_opportunity_deadline
      expected_failure: soql.contains
    mine_from: [tests/test_current_opportunity_retrieval.py::test_red_5_known_expired_deadline_is_excluded]

  - id: PC-TIME-001
