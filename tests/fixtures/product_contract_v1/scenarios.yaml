  - id: PC-MOD-001
    title: "Licitación pública entra como modalidad, no como tema"
    status: READY
    severity: high
    family: modality_control
    mandatory_item: 11
    source: {kind: audit, reference: "ADR-054 modality_resolver_corpus_v1"}
    invariants: [INV-SEM-STRUCTURED-DIMENSION-NOT-TOPIC]
    fixtures: {source_rows: source_rows/f3_processes.jsonl}
    turns:
      - text: "licitaciones públicas de mantenimiento vial en 2025"
        expect:
          params: {modalidad_include_procedure_ids: [licitacion_publica, licitacion_publica_obra]}
          absent_params: [modalidad, modalidad_exclude_procedure_ids]
          datasets_called: {only: [p6dx-8zbt]}
          source_calls: {min: 1}
          soql: {contains: ["modalidad_de_contratacion IN ('Licitación pública', 'Licitación pública Obra Publica')"], not_contains: ["LICITACION%"]}
          results: {must_include_ids: [PC-PROC-MOD-001], must_exclude_ids: [PC-PROC-MOD-DECOY]}
    mutation:
      law: INV-SEM-STRUCTURED-DIMENSION-NOT-TOPIC
      kind: drop_modality
      expected_failure: params.modalidad_include_procedure_ids
    mine_from: [tests/test_modality_resolver.py]

