          needs_clarification: true
          actor_unresolved: true
          params: {actor_resolution_status: AMBIGUOUS}
          absent_params: [contratista]
          source_calls: {exact: 0}
          lineage: {raw_text: "contratos del proveedor lucia margarita quintero sintetica"}
    mutation:
      law: INV-ACTOR-NAME-NO-GUESS
      kind: select_top_actor
      expected_failure: actor_unresolved
    mine_from: [tests/test_beta_entity_actor_conversation.py]

