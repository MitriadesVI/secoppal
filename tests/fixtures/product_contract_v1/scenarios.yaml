    invariants: [INV-STATE-FIRMADO-IS-NOT-A-STATE]
    fixtures: {source_rows: source_rows/f3_money_time.jsonl}
    turns:
      - text: "contratos firmados en 2023 de mantenimiento vial"
        expect:
          outcome: success
          params: {dataset: contratos, fecha_desde: "2023-01-01", fecha_hasta: "2023-12-31"}
          absent_params: [estado]
          datasets_called: {only: [jbjy-vk9h]}
          source_calls: {min: 1}
          soql: {contains: ["fecha_de_firma >= '2023-01-01'", "fecha_de_firma <= '2023-12-31'"]}
          results: {must_include_ids: [PC-SIGNED-2023], must_exclude_ids: [PC-SIGNED-2024]}
    mutation:
      law: INV-STATE-FIRMADO-IS-NOT-A-STATE
      kind: signed_to_state
      expected_failure: absent_params.estado
    mine_from: [tests/test_firmado_signed_semantics.py::test_firmados_en_mayo_no_aplica_estado_filtra_fecha]

