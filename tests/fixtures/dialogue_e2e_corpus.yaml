metadata:
  version: "1.1"
  created: "2026-06-13"
  purpose: >
    M1A.1 hace explícito "departamento" en los escenarios cuyo scope declarado
    es departamental y comparte nombre con municipios DIVIPOLA. Las consultas
    desnudas ambiguas se validan aparte en test_municipal_territory.py.
    Corpus de diálogo E2E multi-turno. Maneja el workflow REAL
    (SecopalWorkflow.run_query) con el parser REAL y round-trip de
    persistencia; SECOP mockeado. Las aserciones son INVARIANTES
    (propiedades que cualquier sistema correcto debe cumplir), NO salidas
    elegidas a mano — para evitar el "síndrome del sastre" (tests cortados
    a la medida del output actual).

  annotations: >
    Cada turno declara la INTENCIÓN del usuario (ground truth), no la
    salida esperada del sistema:
      text            : lo que escribe el usuario
      says_territory  : territorio que el usuario nombra ESTE turno (resuelto)
      says_date       : el usuario menciona una fecha/año este turno
      changes_dataset : el usuario pivota de dataset este turno
      expect          : "block" | "execute"  (resultado esperado a alto nivel)
      expect_include  : procedure_ids canónicos positivos exactos
      expect_exclude  : procedure_ids canónicos negativos exactos
      expect_operation: operación conversacional exacta
      expect_topic_contains / expect_topic_not_contains : contrato de topic
      expect_not_in   : presencia del operador de exclusión en el SoQL

  invariants: >
    Aplicadas automáticamente a TODAS las secuencias:
      I1 expect=block   ⇒ needs_clarification y CERO llamadas a SECOP y sin SoQL
      I2 expect=execute ⇒ no needs_clarification y SoQL no vacío
      I3 persistencia de territorio: el último territorio que el usuario nombró
         debe seguir en los params de cada turno posterior hasta que nombre otro
      I4 no-alucinación de fecha: tras un cambio de dataset sin fecha nueva,
         fecha_desde debe ser None (una fecha de otro dataset no se hereda)
      I6 expectativas M3C declaradas ⇒ filtro/operación/topic/SoQL exactos

sequences:
  # ── Regresión de los 2 bugs hallados en testeo manual ──────────────────
  - id: DLG-PIVOT-DATE-AND-CONTEXT
    note: "bug #1 (fecha cruza dataset) + bug #2 (contexto se pierde)"
    turns:
      - text: "contratos en barranquilla 2026"
        says_territory: Barranquilla
        says_date: true
        expect: execute
      - text: "procesos para presentarme en antioquia"
        says_territory: Antioquia
        changes_dataset: true
        expect: block
      - text: "quiero ver todo"
        expect: block
      - text: "mantenimiento"
        expect: execute

  - id: DLG-CONTENTLESS-CHAIN
    note: "varios turnos vacíos no deben borrar el contexto"
    turns:
      - text: "procesos para presentarme en el departamento de bolivar"
        says_territory: Bolívar
        expect: block
      - text: "muéstrame"
        expect: block
      - text: "a ver"
        expect: block
      - text: "dotación escolar"
        expect: execute

  # ── Sondas independientes (NO diseñadas alrededor de mis fixes) ─────────
  - id: DLG-TOPIC-CHANGE-KEEPS-SCOPE
    note: "cambiar de tema conserva el territorio"
    turns:
      - text: "procesos de mantenimiento en el departamento de bolivar"
        says_territory: Bolívar
        expect: execute
      - text: "ahora alimentación escolar"
        expect: execute

  - id: DLG-SCOPE-CHANGE-KEEPS-TOPIC
    note: "cambiar de territorio conserva el tema"
    turns:
      - text: "procesos de mantenimiento en el departamento de bolivar"
        says_territory: Bolívar
        expect: execute
      - text: "ahora en el departamento de sucre"
        says_territory: Sucre
        expect: execute

  - id: DLG-VALUE-PERSISTS-ON-ORDER
    note: "ordenar no debe perder el filtro de valor ni el territorio"
    turns:
      - text: "procesos de obra en atlantico mayores a 1000 millones"
        says_territory: Atlántico
        expect: execute
      - text: "ordena por fecha"
        expect: execute

  - id: DLG-BIDDER-HAPPY-RECOVERY
    note: "P15: bloquea bidder sin rubro, recupera con rubro"
    turns:
      - text: "quiero presentarme en el departamento de bolivar"
        says_territory: Bolívar
        expect: block
      - text: "vendo uniformes escolares"
        expect: execute

  - id: DLG-UNRELATED-PIVOT-NO-LEAK
    note: "pivote a una búsqueda distinta NO debe arrastrar el territorio viejo"
    turns:
      - text: "procesos de mantenimiento en el departamento de bolivar"
        says_territory: Bolívar
        expect: execute
      - text: "contratos firmados del sena en antioquia"
        says_territory: Antioquia
        changes_dataset: true
        expect: execute

  # ═══════════ 11 secuencias ADVERSARIALES (buscan romper) ═══════════
  - id: DLG-DOUBLE-DATASET-PIVOT
    note: "la fecha no debe sobrevivir a DOS pivotes de dataset"
    turns:
      - text: "contratos de obra en el departamento de bolivar 2025"
        says_territory: Bolívar
        says_date: true
        expect: execute
      - text: "procesos abiertos de obra en el departamento de bolivar"
        says_territory: Bolívar
        changes_dataset: true
        expect: execute
      - text: "y contratos firmados de obra en el departamento de bolivar"
        says_territory: Bolívar
        changes_dataset: true
        expect: execute

  - id: DLG-BLOCK-RECOVER-BY-DATE
    note: "P15 se recupera con una ventana de fecha estrecha como qualifier"
    turns:
      - text: "procesos para presentarme en cundinamarca"
        says_territory: Cundinamarca
        expect: block
      - text: "los publicados en los últimos 30 días"
        says_date: true
        expect: execute

  - id: DLG-BLOCK-RECOVER-BY-VALUE
    note: "P15 se recupera con piso de valor alto (>=1000M)"
    turns:
      - text: "quiero presentarme en huila"
        says_territory: Huila
        expect: block
      - text: "los mayores a 1000 millones"
        expect: execute

  - id: DLG-BLOCK-RECOVER-BY-MODALITY
    note: "P15 se recupera con modalidad como qualifier"
    turns:
      - text: "procesos para presentarme en el departamento de narino"
        says_territory: Nariño
        expect: block
      - text: "por mínima cuantía"
        expect: execute

  - id: DLG-LOW-VALUE-STILL-BLOCKS
    note: "valor por debajo del piso (50M < 1000M) NO es qualifier; sigue bloqueado"
    turns:
      - text: "procesos para presentarme en cesar"
        says_territory: Cesar
        expect: block
      - text: "los mayores a 50 millones"
        expect: block

  - id: DLG-ENTITY-THEN-CONTENTLESS
    note: "entidad concreta + 'ver todo' debe seguir ejecutando (entidad es qualifier)"
    turns:
      - text: "procesos abiertos de la gobernación del atlántico"
        says_territory: Atlántico
        expect: execute
      - text: "quiero ver todo"
        expect: execute

  - id: DLG-EXPLICIT-NEW-SEARCH-RESETS
    note: >
      Un verbo de búsqueda nueva NO debe heredar el territorio viejo.
      (Se usa 'aseo' y no 'salud' a propósito: 'salud en' dispara un bug
      pre-existente del detector direct_lookup — ver test_known_bug_*.)
    turns:
      - text: "procesos de mantenimiento en el departamento de bolivar"
        says_territory: Bolívar
        expect: execute
      - text: "busca contratos de aseo en huila"
        says_territory: Huila
        changes_dataset: true
        expect: execute

  - id: DLG-CITY-TO-DEPT
    note: "cambiar de ciudad a departamento (cambio de clave de scope)"
    turns:
      - text: "procesos de aseo en barranquilla"
        says_territory: Barranquilla
        expect: execute
      - text: "ahora en todo el atlantico"
        says_territory: Atlántico
        expect: execute

  - id: DLG-PAGINATION-KEEPS-CONTEXT
    note: "'muéstrame más' conserva todo el contexto"
    turns:
      - text: "procesos de obra en el departamento de bolivar"
        says_territory: Bolívar
        expect: execute
      - text: "muéstrame más"
        expect: execute

  - id: DLG-REPEAT-IDENTICAL
    note: "repetir la misma consulta es estable"
    turns:
      - text: "procesos de mantenimiento en el departamento de sucre"
        says_territory: Sucre
        expect: execute
      - text: "procesos de mantenimiento en el departamento de sucre"
        says_territory: Sucre
        expect: execute

  - id: DLG-NO-TERRITORY-BLOCK-KEEPS-ASKING
    note: >
      Bloqueo SIN territorio ni rubro: un follow-up de solo-ordering NO debe
      caer en el genérico "perdí el contexto" — debe seguir pidiendo rubro
      (P15), y recordar el orden cuando por fin llega el rubro.
    turns:
      - text: "licitaciones abiertas ahora"
        expect: block
        expect_reason_contains: "producto"
      - text: "muéstrame las más caras"
        expect: block
        expect_reason_contains: "producto"
      - text: "mantenimiento"
        expect: execute

  - id: DLG-BIDDER-THEN-HISTORY-PIVOT
    note: "bidder bloqueado → pivote a contratos firmados debe conservar territorio"
    turns:
      - text: "quiero presentarme en el departamento de bolivar"
        says_territory: Bolívar
        expect: block
      - text: "contratos firmados de mantenimiento"
        changes_dataset: true
        expect: execute

  # ═══════════ M3C-E: contrato conversacional multi-turn congelado ════════
  - id: DLG-M3C-ADD-INCLUDE
    note: "ADD_INCLUDE une la modalidad nueva y conserva el topic"
    turns:
      - text: "licitación pública de mantenimiento"
        expect: execute
      - text: "además contratación directa"
        expect: execute
        expect_operation: add_include
        expect_include:
          - contratacion_directa
          - contratacion_directa_con_ofertas
          - licitacion_publica
          - licitacion_publica_obra
        expect_exclude: []
        expect_topic_contains: [mantenimiento]
        expect_not_in: false

  - id: DLG-M3C-REMOVE-MEMBER
    note: "REMOVE_MEMBER retira solo el miembro de la whitelist"
    turns:
      - text: "licitación pública o contratación directa de mantenimiento"
        expect: execute
      - text: "quita contratación directa"
        expect: execute
        expect_operation: remove_member
        expect_include: [licitacion_publica, licitacion_publica_obra]
        expect_exclude: []
        expect_topic_contains: [mantenimiento]
        expect_not_in: false

  - id: DLG-M3C-REMOVE-EXCLUDE
    note: "REMOVE_EXCLUDE abre el universo sin crear whitelist"
    turns:
      - text: "alimentación excepto contratación directa"
        expect: execute
      - text: "permite contratación directa"
        expect: execute
        expect_operation: remove_exclude
        expect_include: []
        expect_exclude: []
        expect_topic_contains: [alimentacion]
        expect_not_in: false

  - id: DLG-M3C-RESTORE-OPEN
    note: "RESTORE_INCLUDE en universo abierto retira la exclusión sin forzar inclusión"
    turns:
      - text: "alimentación excepto contratación directa"
        expect: execute
      - text: "vuelve a incluir contratación directa"
        expect: execute
        expect_operation: restore_include
        expect_include: []
        expect_exclude: []
        expect_topic_contains: [alimentacion]
        expect_not_in: false

  - id: DLG-M3C-CLEAR
    note: "CLEAR elimina solo el filtro de modalidad y conserva el topic"
    turns:
      - text: "licitación pública de mantenimiento"
        expect: execute
      - text: "sin filtro de modalidad"
        expect: execute
        expect_operation: clear
        expect_include: []
        expect_exclude: []
        expect_topic_contains: [mantenimiento]
        expect_modality_predicate: false

  - id: DLG-M3C-CONTROL-CONFLICT
    note: "controles incompatibles fallan cerrados y conservan el filtro previo"
    turns:
      - text: "contratación directa de alimentación"
        expect: execute
      - text: "agrega y quita contratación directa"
        expect: block
        expect_reason: control_conflict
        expect_include:
          - contratacion_directa
          - contratacion_directa_con_ofertas
        expect_exclude: []
        expect_topic_contains: [alimentacion]

  - id: DLG-M3C-AMBIGUOUS-TARGET
    note: "target M2 ambiguo bloquea sin mutación parcial"
    turns:
      - text: "contratación directa de alimentación"
        expect: execute
      - text: "además subasta"
        expect: block
        expect_operation: add_include
        expect_reason: ambiguous_target
        expect_include:
          - contratacion_directa
          - contratacion_directa_con_ofertas
        expect_exclude: []
        expect_topic_contains: [alimentacion]

  - id: DLG-M3C-DATASET-PIVOT
    note: "el cambio de dataset conserva IDs canónicos y reproyecta el SoQL"
    turns:
      - text: "subasta inversa de alimentación en procesos"
        expect: execute
      - text: "ahora contratos"
        changes_dataset: true
        expect: execute
        expect_dataset: contratos
        expect_include: [seleccion_abreviada_subasta_inversa]
        expect_exclude: []
        expect_topic_contains: [alimentacion]
        expect_not_in: false

  - id: DLG-M3C-MODALITY-PLUS-TOPIC
    note: "un verbo descriptivo no se convierte en ADD_INCLUDE"
    turns:
      - text: "licitación pública de mantenimiento"
        expect: execute
      - text: "contratación directa que incluye suministro"
        expect: execute
        expect_operation: replace
        expect_include:
          - contratacion_directa
          - contratacion_directa_con_ofertas
        expect_exclude: []
        expect_topic_contains: [suministro]
        expect_topic_not_contains: [mantenimiento]
        expect_not_in: false

  - id: DLG-M3C-CLEAR-THEN-REPLACE
    note: "construcción cerrada: limpia y reemplaza en una sola decisión"
    turns:
      - text: "licitación pública de mantenimiento"
        expect: execute
      - text: "no importa la modalidad, solo subasta inversa"
        expect: execute
        expect_operation: replace
        expect_construction: clear_then_replace
        expect_include: [seleccion_abreviada_subasta_inversa]
        expect_exclude: []
        expect_topic_contains: [mantenimiento]
        expect_not_in: false
        expect_modality_predicate: true
